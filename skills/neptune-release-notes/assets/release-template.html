<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{--ink:#17333d;--muted:#63777d;--brand:#007d84;--line:#dce7e9;--soft:#eff7f7;--paper:#fff;--amber:#fff6df}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#f3f6f7;font:16px/1.85 "Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:42px 36px 70px}.hero{background:#123d48;color:white;padding:44px 48px;border-radius:18px}.eyebrow{font-size:12px;letter-spacing:2px;color:#9edbdc}.hero h1{font-size:34px;line-height:1.45;margin:14px 0 16px}.hero p{color:#d2e4e8;margin:0}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;font-size:13px}.meta span{background:#ffffff12;padding:5px 12px;border-radius:5px}.intro{font-size:18px;border-left:4px solid var(--brand);padding:4px 20px;margin:28px 0}nav{display:flex;gap:8px 20px;flex-wrap:wrap;padding:20px 25px;background:white;border:1px solid var(--line);border-radius:12px;margin:24px 0}a{color:var(--brand);text-decoration:none}nav a{font-size:14px}section{background:white;border:1px solid var(--line);padding:30px 36px;margin:20px 0;border-radius:12px;scroll-margin-top:20px}h2{font-size:25px;line-height:1.45;margin:0 0 22px}h2 b{color:var(--brand);font-size:15px;margin-right:12px}h3{font-size:18px;margin:25px 0 9px}p{margin:9px 0 15px}ul,ol{padding-left:24px;margin:10px 0 20px}li{margin:7px 0}.where{font-size:14px;color:var(--brand);background:var(--soft);padding:10px 14px;border-radius:6px}.note{background:var(--soft);border-left:3px solid #60b4b6;padding:13px 17px;margin:18px 0}.caution{background:var(--amber);border-left-color:#d4a545}table{width:100%;border-collapse:collapse;margin:17px 0;font-size:14px}th{text-align:left;background:var(--soft);font-weight:600}td,th{padding:12px 14px;border:1px solid var(--line);vertical-align:top}.flow{display:flex;align-items:stretch;gap:8px;margin:20px 0}.flow div{flex:1;background:var(--soft);padding:14px 10px;border-radius:7px;text-align:center;font-size:14px}.flow span{align-self:center;color:#80a2a6}.small{color:var(--muted);font-size:13px}details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}details p{padding:0 0 0 20px;color:#425d65}footer{margin-top:28px;color:var(--muted);text-align:center;font-size:13px}.print{float:right;background:white;color:var(--brand);border:0;border-radius:5px;padding:8px 14px;cursor:pointer}strong{font-weight:650}@media(max-width:700px){main{padding:18px 14px}.hero{padding:28px 24px}.hero h1{font-size:27px}section{padding:24px 20px}table{font-size:13px}td,th{padding:9px}.flow{flex-wrap:wrap}.flow div{min-width:110px}.print{display:none}}@media print{body{background:white;font-size:11pt}main{max-width:none;padding:0}.hero{border-radius:0;padding:24px;background:#eff7f7!important;color:#17333d}.hero p,.eyebrow{color:#425d65}.meta span{border:1px solid #ccc}nav,.print{display:none}section{border:0;border-radius:0;padding:14px 0;break-inside:auto}h2,h3{break-after:avoid}tr,.note{break-inside:avoid}details p{display:block}footer{border-top:1px solid #ccc;padding:12px}}

.shot{margin:24px 0 32px;padding:18px;background:#f7fafb;border:1px solid var(--line);border-radius:10px;break-inside:avoid}.shot img{display:block;width:100%;height:auto;border:1px solid #dce7e9;border-radius:5px;cursor:zoom-in}.shot.phone img{max-width:370px;margin:auto}.shot figcaption{font-size:14px;color:#425d65;margin:13px 0 0}.shot-source{display:block;font-size:12px;color:#71858a;margin-top:5px}.shot:focus-within{outline:2px solid var(--brand)}#image-viewer{position:fixed;inset:0;background:#09202beb;z-index:99;padding:55px 22px 25px;overflow:auto}#image-viewer[hidden]{display:none}#image-viewer img{display:block;margin:auto;max-width:none;max-height:calc(100vh - 95px);width:auto}#image-viewer button{position:fixed;right:24px;top:12px;background:white;color:#17333d;padding:8px 18px;border:0;border-radius:5px;cursor:pointer}@media print{.shot{padding:7px;max-height:none}.shot.phone img{max-height:470px;width:auto;max-width:100%}#image-viewer{display:none!important}.shot-source{font-size:8pt}}

/* Reading navigation */
nav .toc-title{width:100%;font-size:17px;font-weight:650;color:var(--ink);margin-bottom:6px}
nav a{border-radius:6px;padding:5px 9px;transition:background .15s}
nav a:hover,nav a[aria-current="location"]{background:var(--soft);color:#00646b}
nav a[aria-current="location"]{font-weight:650;box-shadow:inset 3px 0 var(--brand)}
nav a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media screen and (min-width:1100px){
 main{width:calc(100% - 256px);max-width:1120px;margin-left:256px;margin-right:auto;padding:42px 32px 70px}
 nav[aria-label="目录"]{position:fixed;left:20px;top:42px;width:236px;max-height:calc(100vh - 84px);overflow-y:auto;display:flex;flex-direction:column;flex-wrap:nowrap;gap:5px;margin:0;padding:22px 16px;z-index:5;box-shadow:0 6px 24px #17333d08}
 nav .toc-title{padding:0 9px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
 nav a{display:block;line-height:1.6;padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main><header class="hero"><button class="print" onclick="document.querySelectorAll('details').forEach(x=>x.open=true);window.print()">打印 / 保存 PDF</button><div class="eyebrow">NEPTUNE · 给客户经理与业务同事的使用说明</div><h1>@@TITLE@@</h1><p>@@INTRO@@</p><div class="meta"><span>文档状态：@@STATUS@@</span><span>@@DATE_LABEL@@：@@DATE@@</span></div></header><nav aria-label="目录"><div class="toc-title">目录</div>@@TOC@@</nav>@@CONTENT@@<footer>@@TITLE@@</footer></main><div id="image-viewer" hidden role="dialog" aria-label="截图大图" aria-modal="true"><button onclick="hideShot()">关闭 ×</button><img alt="截图大图"></div><script>function showShot(el){const v=document.getElementById('image-viewer');v.querySelector('img').src=el.src;v.querySelector('img').alt=el.alt;v.hidden=false;v.querySelector('button').focus()}function hideShot(){document.getElementById('image-viewer').hidden=true}document.addEventListener('keydown',e=>{if(e.key==='Escape')hideShot()});document.getElementById('image-viewer').addEventListener('click',e=>{if(e.target.id==='image-viewer')hideShot()});</script><script>
(()=>{const links=[...document.querySelectorAll('nav[aria-label="目录"] a')];const sections=links.map(a=>document.querySelector(a.getAttribute('href')));let queued=false;function highlight(){queued=false;let index=0;sections.forEach((section,i)=>{if(section&&section.getBoundingClientRect().top<=150)index=i});if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)index=links.length-1;links.forEach((link,i)=>{if(i===index)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current')})}window.addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(highlight)}},{passive:true});window.addEventListener('resize',highlight);highlight()})();
</script></body></html>
